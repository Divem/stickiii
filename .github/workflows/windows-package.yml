name: Windows installer delivery
on:
  push:
    branches:
      - 'codex/windows-package-*'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare Rust
        run: rustup update stable --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install dependencies
        run: npm ci
      - name: Check version and TypeScript
        run: |
          npm run version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows x64 NSIS installer
        run: npm run package:win -- --no-bump
      - name: Upload installer and build record
        uses: actions/upload-artifact@v4
        with:
          name: stickiii-0.1.1-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/build-0.1.1-win-default.json
          if-no-files-found: error
          retention-days: 7
